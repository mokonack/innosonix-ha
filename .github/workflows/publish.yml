name: "Publish to PyPI"

on:
  release:
    types:
      - published

jobs:
  publish:
    name: "Publish to PyPI"
    runs-on: "ubuntu-latest"
    permissions:
      id-token: write
    steps:
      - uses: "actions/checkout@v4"
      - uses: "actions/setup-python@v5"
        with:
          python-version: "3.12"
      - name: "Build and publish"
        uses: "pypa/gh-action-pypi-publish@release/v1"
