name: "Publish to PyPI"

# The `innosonix` client library is published independently of integration
# releases. Integration releases are `v*` GitHub Releases (consumed by HACS)
# and never publish to PyPI. To publish a new library version, bump `version`
# in pyproject.toml and push a `lib-vX.Y.Z` tag; this workflow fires on that tag.
on:
  push:
    tags:
      - "lib-v*"

jobs:
  publish:
    name: "Publish to PyPI"
    runs-on: "ubuntu-latest"
    environment: "pypi"
    permissions:
      id-token: write
    steps:
      - uses: "actions/checkout@v7"
      - uses: "actions/setup-python@v7"
        with:
          python-version: "3.12"
      - name: "Build distributions"
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: "Publish to PyPI"
        uses: "pypa/gh-action-pypi-publish@release/v1"
