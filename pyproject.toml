[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "innosonix"
version = "0.1.2"
description = "Async Python client for Innosonix MAXX amplifiers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Mokonack" }]
keywords = ["innosonix", "amplifier", "audio", "rest-api"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"License :: OSI Approved :: Apache Software License",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Programming Language :: Python :: 3.14",
	"Topic :: Home Automation",
]
dependencies = [
	"aiohttp>=3.9",
]

[project.urls]
Homepage = "https://github.com/mokonack/innosonix-ha"
Repository = "https://github.com/mokonack/innosonix-ha"
Issues = "https://github.com/mokonack/innosonix-ha/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/innosonix"]
